<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TT Scorer Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #f5f6f8;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --bg-card-hover: #f8f9fb;
    --bg-input: #f5f6f8;
    --border: #e2e6ec;
    --border-light: #d0d5dd;
    --text-primary: #1a1a2e;
    --text-secondary: #4a4a5a;
    --text-muted: #8a8a9a;
    --accent: #0066cc;
    --accent-light: #e8f0fe;
    --accent-glow: rgba(0, 102, 204, 0.1);
    --home: #0066cc;
    --home-dim: rgba(0, 102, 204, 0.08);
    --guest: #cc3300;
    --guest-dim: rgba(204, 51, 0, 0.08);
    --win: #008855;
    --loss: #cc3300;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.08);
    --radius: 8px;
    --radius-sm: 6px;
    --transition: all 0.15s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

  .header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
    gap: 8px;
    box-shadow: var(--shadow);
  }

  .logo {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-primary);
  }
  .logo .icon { font-size: 22px; }
  .logo .highlight { color: var(--accent); }

  .header-nav {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
  }

  .nav-btn {
    background: none;
    border: 1px solid transparent;
    color: var(--text-secondary);
    padding: 5px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    transition: var(--transition);
  }
  .nav-btn:hover {
    color: var(--text-primary);
    background: var(--bg-input);
  }
  .nav-btn.active {
    color: var(--accent);
    background: var(--accent-light);
    border-color: var(--accent);
  }

  .nav-btn.mode-btn {
    font-size: 12px;
    padding: 4px 10px;
    font-weight: 600;
    background: var(--bg-input);
    border-color: var(--border);
  }
  .nav-btn.mode-btn:hover {
    border-color: var(--border-light);
    color: var(--text-primary);
  }
  .nav-btn.mode-btn.active-mode {
    color: var(--accent);
    background: var(--accent-light);
    border-color: var(--accent);
  }

  .nav-btn.import-btn {
    position: relative;
    overflow: hidden;
    font-size: 12px;
    padding: 5px 12px;
  }
  .nav-btn.import-btn input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    font-size: 0;
  }

  .divider {
    color: var(--border);
    font-size: 16px;
    font-weight: 300;
    padding: 0 2px;
  }

  .view {
    display: none;
    padding: 20px 0 40px;
    max-width: 900px;
    margin: 0 auto;
  }
  .view.active { display: block; }

  .view-inner { padding: 0 20px; }

  .scoreboard {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }

  .teams-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .team-name-input {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    width: 100%;
    text-align: center;
    transition: var(--transition);
  }
  .team-name-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .team-name-input::placeholder { color: var(--text-muted); }
  .team-name-input.home { border-left: 3px solid var(--home); }
  .team-name-input.guest { border-right: 3px solid var(--guest); }

  .vs-score {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .vs-score .home-pts { color: var(--home); }
  .vs-score .sep { color: var(--text-muted); font-weight: 300; }
  .vs-score .guest-pts { color: var(--guest); }

  .date-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }

  .date-input {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    transition: var(--transition);
  }
  .date-input:focus {
    outline: none;
    border-color: var(--accent);
    color: var(--text-primary);
  }

  .badge {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--bg-input);
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  .badge-auto {
    color: var(--win);
    border-color: rgba(0, 136, 85, 0.2);
    background: rgba(0, 136, 85, 0.06);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .badge-auto .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--win);
    animation: pulse 2s infinite;
  }

  .badge-file {
    color: var(--accent);
    border-color: rgba(0, 102, 204, 0.2);
    background: rgba(0, 102, 204, 0.06);
    font-size: 9px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .badge-file:hover {
    background: rgba(0, 102, 204, 0.12);
  }
  .badge-file.active {
    color: var(--win);
    border-color: rgba(0, 136, 85, 0.2);
    background: rgba(0, 136, 85, 0.06);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .section-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    padding-left: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .players-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 20px;
  }

  .player-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: var(--transition);
  }
  .player-card:hover { background: var(--bg-card-hover); border-color: var(--border-light); }

  .player-num {
    font-size: 13px;
    font-weight: 700;
    width: 22px;
    text-align: center;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .player-num.home { color: var(--home); }
  .player-num.guest { color: var(--guest); }

  .player-input {
    background: none;
    border: none;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    width: 100%;
    padding: 3px 0;
    border-bottom: 1px solid transparent;
    transition: var(--transition);
  }
  .player-input:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }
  .player-input::placeholder {
    color: var(--text-muted);
    font-weight: 400;
  }

  .double-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 8px;
    transition: var(--transition);
  }
  .double-block:hover { border-color: var(--border-light); }

  .double-block .double-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.3px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .doubles-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .doubles-label {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--home);
    background: var(--home-dim);
    padding: 1px 8px;
    border-radius: 3px;
    margin-bottom: 3px;
  }
  .doubles-label.guest-label {
    color: var(--guest);
    background: var(--guest-dim);
  }

  .doubles-select {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 5px 8px;
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    width: 100%;
    margin-bottom: 3px;
    cursor: pointer;
    transition: var(--transition);
  }
  .doubles-select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .doubles-select option {
    background: var(--bg-card);
  }

  .match-card {
    background: var(--bg-card);
    border-left: 3px solid transparent;
    border-right: 1px solid var(--border);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    padding: 10px 14px;
    margin-bottom: 3px;
    transition: var(--transition);
  }
  .match-card:first-of-type {
    border-top-left-radius: var(--radius-sm);
    border-top-right-radius: var(--radius-sm);
  }
  .match-card:last-of-type {
    border-bottom-left-radius: var(--radius-sm);
    border-bottom-right-radius: var(--radius-sm);
    margin-bottom: 0;
  }
  .match-card:hover { background: var(--bg-card-hover); }

  .match-card.won-home {
    border-left-color: var(--home);
    background: var(--home-dim);
  }
  .match-card.won-guest {
    border-left-color: var(--guest);
    background: var(--guest-dim);
  }

  .match-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    flex-wrap: wrap;
    gap: 4px;
  }

  .match-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .match-players {
    font-size: 13px;
    font-weight: 500;
    flex: 1;
    text-align: center;
    padding: 0 8px;
  }
  .match-players .home-p { color: var(--home); }
  .match-players .guest-p { color: var(--guest); }
  .match-players .vs { color: var(--text-muted); font-weight: 400; }

  .match-winner-badge {
    font-size: 9px;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 10px;
    letter-spacing: 0.2px;
    text-transform: uppercase;
  }
  .match-winner-badge.home {
    background: var(--home-dim);
    color: var(--home);
  }
  .match-winner-badge.guest {
    background: var(--guest-dim);
    color: var(--guest);
  }

  .sets-container {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    display: flex;
    align-items: stretch;
    gap: 4px;
  }

  .set-box {
    flex: 1;
    text-align: center;
    padding: 4px 2px;
    border-radius: 4px;
    background: var(--bg-secondary);
    border: 1px solid transparent;
    transition: var(--transition);
    min-width: 0;
  }
  .set-box.set5 {
    border-color: var(--border-light);
    background: var(--bg-card);
  }

  .set-box .set-num {
    font-size: 8px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 2px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .set-box.set5 .set-num { color: var(--text-secondary); }

  .set-inputs {
    display: flex;
    gap: 2px;
    align-items: center;
    justify-content: center;
  }

  .set-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    width: 34px;
    height: 24px;
    text-align: center;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    transition: var(--transition);
    padding: 0 1px;
  }
  .set-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .set-input::-webkit-outer-spin-button,
  .set-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .set-input[type=number] { -moz-appearance: textfield; }

  .set-sep {
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 600;
  }

  .set-box.set5 .set-input {
    border-color: var(--border-light);
    background: var(--bg-input);
  }

  .final-bar {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
    box-shadow: var(--shadow);
  }

  .final-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .final-result {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .final-result .h { color: var(--home); }
  .final-result .sep { color: var(--text-muted); font-weight: 300; }
  .final-result .g { color: var(--guest); }

  .winner-label {
    font-size: 13px;
    font-weight: 600;
    padding: 3px 14px;
    border-radius: 16px;
  }
  .winner-label.home {
    color: var(--home);
    background: var(--home-dim);
  }
  .winner-label.guest {
    color: var(--guest);
    background: var(--guest-dim);
  }
  .winner-label.draw {
    color: var(--text-muted);
    background: var(--bg-input);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    transition: var(--transition);
  }

  .btn-primary {
    background: var(--accent);
    color: #ffffff;
    width: 100%;
    padding: 12px;
    font-size: 14px;
    border-radius: var(--radius-sm);
  }
  .btn-primary:hover {
    background: #0055aa;
    box-shadow: var(--shadow-hover);
  }

  .btn-outline {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .btn-outline:hover {
    border-color: var(--text-secondary);
    color: var(--text-primary);
    background: var(--bg-input);
  }

  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 5px 12px;
    font-size: 12px;
  }
  .btn-ghost:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  .btn-success {
    background: rgba(0, 136, 85, 0.08);
    border: 1px solid rgba(0, 136, 85, 0.15);
    color: var(--win);
    padding: 5px 12px;
    font-size: 12px;
  }
  .btn-success:hover {
    background: rgba(0, 136, 85, 0.12);
  }

  .btn-danger {
    background: none;
    border: 1px solid rgba(204, 51, 0, 0.15);
    color: var(--loss);
    padding: 5px 12px;
    font-size: 12px;
  }
  .btn-danger:hover {
    background: rgba(204, 51, 0, 0.08);
  }

  .btn-file {
    background: rgba(0, 102, 204, 0.06);
    border: 1px solid rgba(0, 102, 204, 0.15);
    color: var(--accent);
    padding: 5px 12px;
    font-size: 12px;
  }
  .btn-file:hover {
    background: rgba(0, 102, 204, 0.12);
  }
  .btn-file.active {
    color: var(--win);
    border-color: rgba(0, 136, 85, 0.2);
    background: rgba(0, 136, 85, 0.06);
  }

  .toolbar {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .history-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow);
  }
  .history-card:hover {
    border-color: var(--border-light);
    box-shadow: var(--shadow-hover);
    transform: translateX(3px);
  }

  .history-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 3px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .history-teams {
    font-weight: 600;
    font-size: 14px;
  }
  .history-score {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .history-score .h { color: var(--home); }
  .history-score .sep { color: var(--text-muted); }
  .history-score .g { color: var(--guest); }
  .history-date {
    font-size: 11px;
    color: var(--text-muted);
  }
  .history-badge {
    font-size: 9px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg-input);
    padding: 1px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .history-empty {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
  }
  .history-empty .big {
    font-size: 48px;
    display: block;
    margin-bottom: 10px;
    color: var(--border);
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    z-index: 200;
    padding: 20px;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; padding-top: 40px; }

  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 520px;
    position: relative;
    box-shadow: var(--shadow-hover);
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    transition: var(--transition);
  }
  .modal-close:hover { color: var(--text-primary); }

  .modal-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 14px;
  }

  .result-match-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .result-match-row:last-child { border-bottom: none; }
  .result-players { flex: 1; }
  .result-players .h { color: var(--home); }
  .result-players .g { color: var(--guest); }
  .result-score {
    font-weight: 700;
    margin: 0 10px;
    font-variant-numeric: tabular-nums;
  }
  .result-win {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 10px;
  }
  .result-win.home {
    color: var(--home);
    background: var(--home-dim);
  }
  .result-win.guest {
    color: var(--guest);
    background: var(--guest-dim);
  }
  .result-win.draw {
    color: var(--text-muted);
    background: var(--bg-input);
  }

  .modal-actions {
    display: flex;
    gap: 6px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .modal-actions .btn { flex: 1; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 10px 22px;
    border-radius: var(--radius-sm);
    font-weight: 500;
    font-size: 13px;
    z-index: 300;
    transition: transform 0.3s ease;
    pointer-events: none;
    box-shadow: var(--shadow-hover);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 700px) {
    .teams-row {
      grid-template-columns: 1fr;
      gap: 6px;
    }
    .vs-score { font-size: 36px; }
    .sets-container { flex-wrap: wrap; }
    .set-box { flex: 1 1 calc(33.33% - 4px); min-width: 50px; }
    .players-grid { grid-template-columns: 1fr; }
    .doubles-grid { grid-template-columns: 1fr; }
    .header { padding: 8px 16px; }
    .logo { font-size: 18px; }
    .view-inner { padding: 0 12px; }
    .match-card { padding: 8px 10px; }
    .set-input { width: 30px; height: 22px; font-size: 11px; }
    .final-result { font-size: 24px; }
    .modal { margin: 10px; padding: 16px; }
  }

  @media (max-width: 480px) {
    .vs-score { font-size: 28px; }
    .header-nav .nav-btn { font-size: 11px; padding: 4px 8px; }
    .divider { display: none; }
    .match-players { font-size: 12px; }
    .set-box { flex: 1 1 calc(50% - 4px); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <span class="icon">🏓</span>
    TT<span class="highlight">Scorer</span>
  </div>
  <div class="header-nav">
    <button class="nav-btn active" onclick="showView('spielbericht')">Spielbericht</button>
    <button class="nav-btn" onclick="showView('verlauf')">Verlauf</button>
    <span class="divider">|</span>
    <button class="nav-btn mode-btn active-mode" data-mode="4" onclick="setMode(4)">4er</button>
    <button class="nav-btn mode-btn" data-mode="6" onclick="setMode(6)">6er</button>
    <span class="divider">|</span>
    <button class="nav-btn import-btn" onclick="document.getElementById('fileInput').click()">
      📂 Import
      <input type="file" id="fileInput" accept=".txt,.json" onchange="importSpiel(event)">
    </button>
    <button class="nav-btn" onclick="exportSpiel()">📤 Export</button>
  </div>
</div>

<!-- SPIELBERICHT VIEW -->
<div id="view-spielbericht" class="view active">
<div class="view-inner">
  <div class="scoreboard">
    <div class="teams-row">
      <input class="team-name-input home" id="heimName" type="text" placeholder="Heimteam" value="Heimteam" tabindex="1">
      <div class="vs-score">
        <span class="home-pts" id="scoreHeim">0</span>
        <span class="sep">:</span>
        <span class="guest-pts" id="scoreGast">0</span>
      </div>
      <input class="team-name-input guest" id="gastName" type="text" placeholder="Gastteam" value="Gastteam" tabindex="2">
    </div>
    <div class="date-row">
      <input class="date-input" type="date" id="spielDatum" tabindex="3">
      <input class="date-input" type="text" id="spielOrt" placeholder="Ort / Halle" style="width:140px" tabindex="4">
      <span class="badge" id="modeIndicator">4er</span>
      <span class="badge badge-auto"><span class="dot"></span> Auto-Save</span>
      <span class="badge badge-file" id="fileStatus" onclick="initFileAutoSave()">💾 Datei: ✗</span>
    </div>
  </div>

  <div class="section-title">Aufstellung</div>
  <div class="players-grid" id="playersGrid"></div>

  <div class="section-title">Doppel</div>
  <div id="doublesContainer"></div>

  <div class="section-title">Spiele</div>
</div>

  <div id="matchList"></div>

<div class="view-inner">
  <div class="final-bar">
    <div>
      <div class="final-label">Ergebnis</div>
      <div class="final-result">
        <span class="h" id="finalH">0</span>
        <span class="sep">:</span>
        <span class="g" id="finalG">0</span>
      </div>
    </div>
    <div id="siegerLabel" class="winner-label draw">—</div>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="saveSpielbericht()">💾 Spielbericht speichern</button>
  </div>
  <div class="toolbar">
    <button class="btn btn-ghost" style="flex:1;justify-content:center" onclick="resetForm()">🔄 Neues Spiel</button>
    <button class="btn btn-file" id="fileInitBtn" onclick="initFileAutoSave()">📁 Datei-AutoSave aktivieren</button>
  </div>
</div>
</div>

<!-- VERLAUF VIEW -->
<div id="view-verlauf" class="view">
  <div id="verlaufList"></div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle">Spielbericht</div>
    <div id="modalContent"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="downloadSpiel()">⬇ Herunterladen</button>
      <button class="btn btn-danger" onclick="deleteSpiel()">Löschen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== KONFIGURATION ======
let currentMode = 4;
let autoSaveTimer = null;
let fileSaveTimer = null;
let fileHandle = null;
let fileAutoSaveActive = false;
const AUTO_SAVE_INTERVAL = 30000;

function getMatchConfig(mode) {
  if (mode === 4) {
    return [
      { id: 'D1', label: 'Doppel 1', type: 'double', dIdx: 0 },
      { id: 'D2', label: 'Doppel 2', type: 'double', dIdx: 1 },
      { id: 'E1', label: 'Einzel 1', type: 'single', hIdx: 1, gIdx: 2 },
      { id: 'E2', label: 'Einzel 2', type: 'single', hIdx: 2, gIdx: 1 },
      { id: 'E3', label: 'Einzel 3', type: 'single', hIdx: 3, gIdx: 4 },
      { id: 'E4', label: 'Einzel 4', type: 'single', hIdx: 4, gIdx: 3 },
      { id: 'E5', label: 'Einzel 5', type: 'single', hIdx: 1, gIdx: 1 },
      { id: 'E6', label: 'Einzel 6', type: 'single', hIdx: 2, gIdx: 2 },
      { id: 'E7', label: 'Einzel 7', type: 'single', hIdx: 3, gIdx: 3 },
      { id: 'E8', label: 'Einzel 8', type: 'single', hIdx: 4, gIdx: 4 },
    ];
  } else {
    return [
      { id: 'D1', label: 'Doppel 1', type: 'double', dIdx: 0 },
      { id: 'D2', label: 'Doppel 2', type: 'double', dIdx: 1 },
      { id: 'D3', label: 'Doppel 3', type: 'double', dIdx: 2 },
      { id: 'E1', label: 'Einzel 1', type: 'single', hIdx: 1, gIdx: 2 },
      { id: 'E2', label: 'Einzel 2', type: 'single', hIdx: 2, gIdx: 1 },
      { id: 'E3', label: 'Einzel 3', type: 'single', hIdx: 3, gIdx: 4 },
      { id: 'E4', label: 'Einzel 4', type: 'single', hIdx: 4, gIdx: 3 },
      { id: 'E5', label: 'Einzel 5', type: 'single', hIdx: 5, gIdx: 6 },
      { id: 'E6', label: 'Einzel 6', type: 'single', hIdx: 6, gIdx: 5 },
      { id: 'E7', label: 'Einzel 7', type: 'single', hIdx: 1, gIdx: 1 },
      { id: 'E8', label: 'Einzel 8', type: 'single', hIdx: 2, gIdx: 2 },
      { id: 'E9', label: 'Einzel 9', type: 'single', hIdx: 3, gIdx: 3 },
      { id: 'E10', label: 'Einzel 10', type: 'single', hIdx: 4, gIdx: 4 },
      { id: 'E11', label: 'Einzel 11', type: 'single', hIdx: 5, gIdx: 5 },
      { id: 'E12', label: 'Einzel 12', type: 'single', hIdx: 6, gIdx: 6 },
    ];
  }
}

let sets = {};

function getDoubleCount(mode) { return mode === 4 ? 2 : 3; }
function getPlayerCount(mode) { return mode; }

// ====== INIT ======
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('spielDatum').value = today;

  if (!loadAutoSave()) {
    initMode(4);
  }

  startAutoSave();
  
  // Prüfen ob File-AutoSave bereits aktiviert ist
  if (localStorage.getItem('tt_file_handle')) {
    try {
      const savedHandle = JSON.parse(localStorage.getItem('tt_file_handle'));
      // File Handle kann nicht serialisiert werden – neu anfordern
      localStorage.removeItem('tt_file_handle');
    } catch (e) {}
  }
  
  window.addEventListener('beforeunload', () => { 
    manualAutoSave();
    if (fileAutoSaveActive) {
      saveFileAutoSave();
    }
  });
});

function initMode(mode) {
  currentMode = mode;
  const config = getMatchConfig(mode);
  sets = {};
  config.forEach(m => {
    sets[m.id] = Array.from({length:5}, () => ({h:'', g:''}));
  });

  document.getElementById('modeIndicator').textContent = mode + 'er';

  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active-mode', parseInt(b.dataset.mode) === mode);
  });

  renderPlayers(mode);
  renderDoubles(mode);
  updateDoubleSelects();
  renderMatchList();
}

function setMode(mode) {
  if (mode === currentMode) return;
  if (!confirm(`Auf ${mode}er-Mannschaft wechseln? Die aktuellen Eingaben werden zurückgesetzt.`)) return;
  const count = getPlayerCount(mode);
  for (let i = 1; i <= Math.max(4, 6); i++) {
    const hEl = document.getElementById('h'+i);
    const gEl = document.getElementById('g'+i);
    if (hEl) hEl.value = '';
    if (gEl) gEl.value = '';
  }
  for (let d = 1; d <= 3; d++) {
    ['a','b'].forEach(suffix => {
      ['h','g'].forEach(side => {
        const el = document.getElementById(side+'d'+d+suffix);
        if (el) el.innerHTML = '';
      });
    });
  }
  initMode(mode);
  showToast(`Auf ${mode}er gewechselt`);
}

// ====== AUTO-SAVE (localStorage) ======
function startAutoSave() {
  if (autoSaveTimer) clearInterval(autoSaveTimer);
  autoSaveTimer = setInterval(() => { manualAutoSave(); }, AUTO_SAVE_INTERVAL);
}

function manualAutoSave() {
  try {
    const data = getCurrentState();
    localStorage.setItem('tt_autosave', JSON.stringify(data));
  } catch (e) {}
}

function loadAutoSave() {
  try {
    const raw = localStorage.getItem('tt_autosave');
    if (!raw) return false;
    const data = JSON.parse(raw);
    restoreState(data);
    return true;
  } catch (e) {
    return false;
  }
}

// ====== FILE AUTO-SAVE (mit File System Access API) ======
async function initFileAutoSave() {
  try {
    // Prüfen ob die API verfügbar ist
    if (!('showSaveFilePicker' in window)) {
      showToast('⚠️ Datei-AutoSave wird von Ihrem Browser nicht unterstützt. Bitte verwenden Sie Chrome/Edge.');
      return;
    }

    // Datei zum Speichern auswählen
    const handle = await window.showSaveFilePicker({
      suggestedName: 'auto-save-tt.json',
      types: [{
        description: 'JSON-Datei',
        accept: { 'application/json': ['.json'] },
      }],
    });
    
    fileHandle = handle;
    fileAutoSaveActive = true;
    
    // Status aktualisieren
    document.getElementById('fileStatus').textContent = '💾 Datei: ✓';
    document.getElementById('fileStatus').classList.add('active');
    document.getElementById('fileInitBtn').textContent = '✅ Datei-AutoSave aktiv';
    document.getElementById('fileInitBtn').classList.add('active');
    
    // Ersten Speichervorgang durchführen
    await saveFileAutoSave();
    
    // Timer starten
    if (fileSaveTimer) clearInterval(fileSaveTimer);
    fileSaveTimer = setInterval(() => { 
      saveFileAutoSave();
    }, AUTO_SAVE_INTERVAL);
    
    showToast('✅ Datei-AutoSave aktiviert! Speichert alle 30 Sekunden.');
  } catch (err) {
    if (err.name !== 'AbortError' && err.name !== 'SecurityError') {
      console.error('Fehler beim Initialisieren des Datei-AutoSave:', err);
      showToast('❌ Fehler beim Aktivieren des Datei-AutoSave');
    }
  }
}

async function saveFileAutoSave() {
  if (!fileAutoSaveActive || !fileHandle) return;
  
  try {
    const data = getCurrentState();
    const json = JSON.stringify(data, null, 2);
    
    // Datei zum Schreiben öffnen (überschreibt bestehende Datei)
    const writable = await fileHandle.createWritable({ keepExistingData: false });
    await writable.write(json);
    await writable.close();
    
    // Status kurz aktualisieren
    const status = document.getElementById('fileStatus');
    status.textContent = '💾 ' + new Date().toLocaleTimeString();
    setTimeout(() => {
      status.textContent = '💾 Datei: ✓';
    }, 2000);
  } catch (err) {
    // Wenn die Berechtigung verloren gegangen ist, neu aktivieren
    if (err.name === 'NotAllowedError' || err.name === 'SecurityError') {
      fileAutoSaveActive = false;
      document.getElementById('fileStatus').textContent = '💾 Datei: ✗';
      document.getElementById('fileStatus').classList.remove('active');
      document.getElementById('fileInitBtn').textContent = '📁 Datei-AutoSave aktivieren';
      document.getElementById('fileInitBtn').classList.remove('active');
      showToast('⚠️ Berechtigung für Datei-AutoSave verloren – bitte neu aktivieren');
    }
  }
}

// ====== STATE MANAGEMENT ======
function getCurrentState() {
  const {h, g} = getPlayers();
  const heimName = document.getElementById('heimName').value || 'Heimteam';
  const gastName = document.getElementById('gastName').value || 'Gastteam';
  const datum = document.getElementById('spielDatum').value;
  const ort = document.getElementById('spielOrt').value;
  const mode = currentMode;

  const doubleCount = getDoubleCount(mode);
  const hd = [], gd = [];
  for (let d = 1; d <= doubleCount; d++) {
    hd.push([
      document.getElementById('hd'+d+'a')?.value || '1',
      document.getElementById('hd'+d+'b')?.value || '2'
    ]);
    gd.push([
      document.getElementById('gd'+d+'a')?.value || '1',
      document.getElementById('gd'+d+'b')?.value || '2'
    ]);
  }

  return {
    mode,
    heimName, gastName, datum, ort,
    h, g, hd, gd,
    sets: JSON.parse(JSON.stringify(sets)),
    timestamp: Date.now()
  };
}

function restoreState(data) {
  currentMode = data.mode || 4;
  document.getElementById('heimName').value = data.heimName || 'Heimteam';
  document.getElementById('gastName').value = data.gastName || 'Gastteam';
  document.getElementById('spielDatum').value = data.datum || new Date().toISOString().split('T')[0];
  document.getElementById('spielOrt').value = data.ort || '';

  const config = getMatchConfig(currentMode);
  sets = {};
  config.forEach(m => {
    if (data.sets && data.sets[m.id]) {
      sets[m.id] = data.sets[m.id];
    } else {
      sets[m.id] = Array.from({length:5}, () => ({h:'', g:''}));
    }
  });

  document.getElementById('modeIndicator').textContent = currentMode + 'er';
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active-mode', parseInt(b.dataset.mode) === currentMode);
  });

  renderPlayers(currentMode);
  renderDoubles(currentMode);

  if (data.h) {
    for (let i = 0; i < data.h.length; i++) {
      const el = document.getElementById('h'+(i+1));
      if (el) el.value = data.h[i] || '';
    }
  }
  if (data.g) {
    for (let i = 0; i < data.g.length; i++) {
      const el = document.getElementById('g'+(i+1));
      if (el) el.value = data.g[i] || '';
    }
  }

  const doubleCount = getDoubleCount(currentMode);
  if (data.hd) {
    for (let d = 0; d < Math.min(data.hd.length, doubleCount); d++) {
      const a = document.getElementById('hd'+(d+1)+'a');
      const b = document.getElementById('hd'+(d+1)+'b');
      if (a && data.hd[d][0]) a.value = data.hd[d][0];
      if (b && data.hd[d][1]) b.value = data.hd[d][1];
    }
  }
  if (data.gd) {
    for (let d = 0; d < Math.min(data.gd.length, doubleCount); d++) {
      const a = document.getElementById('gd'+(d+1)+'a');
      const b = document.getElementById('gd'+(d+1)+'b');
      if (a && data.gd[d][0]) a.value = data.gd[d][0];
      if (b && data.gd[d][1]) b.value = data.gd[d][1];
    }
  }

  updateDoubleSelects();
  renderMatchList();
  showToast('Automatisch gesicherter Stand wiederhergestellt');
}

// ====== PLAYER ======
function renderPlayers(mode) {
  const container = document.getElementById('playersGrid');
  const count = getPlayerCount(mode);
  let html = '';
  let tabIndex = 5;
  for (let i = 1; i <= count; i++) {
    html += `
      <div class="player-card">
        <span class="player-num home">${i}</span>
        <input class="player-input" id="h${i}" type="text" placeholder="Spieler ${i}" onchange="onPlayerChange()" tabindex="${tabIndex++}">
      </div>
      <div class="player-card">
        <span class="player-num guest">${i}</span>
        <input class="player-input" id="g${i}" type="text" placeholder="Spieler ${i}" onchange="onPlayerChange()" tabindex="${tabIndex++}">
      </div>
    `;
  }
  container.innerHTML = html;
  for (let i = 1; i <= count; i++) {
    document.getElementById('h'+i)?.addEventListener('change', onPlayerChange);
    document.getElementById('g'+i)?.addEventListener('change', onPlayerChange);
  }
}

function onPlayerChange() {
  updateDoubleSelects();
  renderMatchList();
  manualAutoSave();
  if (fileAutoSaveActive) saveFileAutoSave();
}

function getPlayers() {
  const count = getPlayerCount(currentMode);
  const h = [], g = [];
  for (let i = 1; i <= count; i++) {
    const hEl = document.getElementById('h'+i);
    const gEl = document.getElementById('g'+i);
    h.push(hEl ? hEl.value || 'H'+i : 'H'+i);
    g.push(gEl ? gEl.value || 'G'+i : 'G'+i);
  }
  return {h, g};
}

// ====== DOUBLES ======
function renderDoubles(mode) {
  const container = document.getElementById('doublesContainer');
  const count = getDoubleCount(mode);
  let html = '';
  let tabIndex = 5 + getPlayerCount(mode) * 2;
  for (let d = 1; d <= count; d++) {
    html += `
      <div class="double-block">
        <div class="double-title">Doppel ${d}</div>
        <div class="doubles-grid">
          <div>
            <div class="doubles-label">HEIM</div>
            <select class="doubles-select" id="hd${d}a" onchange="onDoubleChange()" tabindex="${tabIndex++}"></select>
            <select class="doubles-select" id="hd${d}b" onchange="onDoubleChange()" tabindex="${tabIndex++}"></select>
          </div>
          <div>
            <div class="doubles-label guest-label">GAST</div>
            <select class="doubles-select" id="gd${d}a" onchange="onDoubleChange()" tabindex="${tabIndex++}"></select>
            <select class="doubles-select" id="gd${d}b" onchange="onDoubleChange()" tabindex="${tabIndex++}"></select>
          </div>
        </div>
      </div>
    `;
  }
  container.innerHTML = html;
  updateDoubleSelects();
}

function updateDoubleSelects() {
  const {h, g} = getPlayers();
  const count = getDoubleCount(currentMode);
  for (let d = 1; d <= count; d++) {
    ['a','b'].forEach(suffix => {
      const hEl = document.getElementById('hd'+d+suffix);
      const gEl = document.getElementById('gd'+d+suffix);
      if (hEl) {
        const val = hEl.value;
        hEl.innerHTML = h.map((n,i) => `<option value="${i+1}">${n}</option>`).join('');
        if (val && val <= h.length) hEl.value = val;
      }
      if (gEl) {
        const val = gEl.value;
        gEl.innerHTML = g.map((n,i) => `<option value="${i+1}">${n}</option>`).join('');
        if (val && val <= g.length) gEl.value = val;
      }
    });
  }
}

function onDoubleChange() {
  renderMatchList();
  manualAutoSave();
  if (fileAutoSaveActive) saveFileAutoSave();
}

// ====== MATCH LIST ======
function renderMatchList() {
  const {h, g} = getPlayers();
  const config = getMatchConfig(currentMode);
  const doubleCount = getDoubleCount(currentMode);

  const doubles = [];
  for (let d = 1; d <= doubleCount; d++) {
    const a = parseInt(document.getElementById('hd'+d+'a')?.value || 1) - 1;
    const b = parseInt(document.getElementById('hd'+d+'b')?.value || 2) - 1;
    const c = parseInt(document.getElementById('gd'+d+'a')?.value || 1) - 1;
    const dd = parseInt(document.getElementById('gd'+d+'b')?.value || 2) - 1;
    doubles.push({h: [a,b], g: [c,dd]});
  }

  const container = document.getElementById('matchList');
  container.innerHTML = '';

  config.forEach(m => {
    let hName, gName;
    if (m.type === 'double') {
      const d = doubles[m.dIdx];
      if (d && d.h[0] !== undefined && d.h[1] !== undefined) {
        hName = (h[d.h[0]] || '?') + ' / ' + (h[d.h[1]] || '?');
        gName = (g[d.g[0]] || '?') + ' / ' + (g[d.g[1]] || '?');
      } else {
        hName = '—';
        gName = '—';
      }
    } else {
      hName = h[m.hIdx-1] || 'H'+m.hIdx;
      gName = g[m.gIdx-1] || 'G'+m.gIdx;
    }

    const matchSets = sets[m.id] || Array.from({length:5}, () => ({h:'', g:''}));
    const {hWins, gWins} = calcSets(matchSets);
    const winner = hWins >= 3 ? 'home' : (gWins >= 3 ? 'guest' : '');

    let winnerBadge = '';
    if (winner) {
      const wName = winner === 'home' ? hName.split('/')[0].trim() : gName.split('/')[0].trim();
      winnerBadge = `<span class="match-winner-badge ${winner}">${wName}</span>`;
    }

    let setsHTML = '';
    for (let si = 0; si < 5; si++) {
      const isSet5 = si === 4;
      setsHTML += `
        <div class="set-box ${isSet5 ? 'set5' : ''}">
          <div class="set-num">${isSet5 ? 'S5' : 'S'+(si+1)}</div>
          <div class="set-inputs">
            <input class="set-input" type="number" min="0" max="99" value="${matchSets[si].h}" data-match="${m.id}" data-set="${si}" data-side="h" onchange="onSetChange(this)" onblur="onSetBlur(this)" onfocus="this.select()" onkeydown="handleArrowKeys(event)">
            <span class="set-sep">:</span>
            <input class="set-input" type="number" min="0" max="99" value="${matchSets[si].g}" data-match="${m.id}" data-set="${si}" data-side="g" onchange="onSetChange(this)" onblur="onSetBlur(this)" onfocus="this.select()" onkeydown="handleArrowKeys(event)">
          </div>
        </div>
      `;
    }

    const card = document.createElement('div');
    card.className = 'match-card' + (winner === 'home' ? ' won-home' : winner === 'guest' ? ' won-guest' : '');
    card.innerHTML = `
      <div class="match-header">
        <span class="match-label">${m.label}</span>
        <span class="match-players">
          <span class="home-p">${hName}</span>
          <span class="vs">vs</span>
          <span class="guest-p">${gName}</span>
        </span>
        ${winnerBadge}
      </div>
      <div class="sets-container">${setsHTML}</div>
    `;
    container.appendChild(card);
  });

  updateTotalScore();
}

function handleArrowKeys(event) {
  const key = event.key;
  const input = event.target;
  
  if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) return;
  
  event.preventDefault();
  
  const allInputs = document.querySelectorAll('#matchList .set-input');
  const currentIndex = Array.from(allInputs).indexOf(input);
  
  if (currentIndex === -1) return;
  
  let targetIndex = currentIndex;
  const cols = 10;
  
  switch (key) {
    case 'ArrowLeft':
      targetIndex = Math.max(0, currentIndex - 1);
      break;
    case 'ArrowRight':
      targetIndex = Math.min(allInputs.length - 1, currentIndex + 1);
      break;
    case 'ArrowUp':
      targetIndex = Math.max(0, currentIndex - cols);
      break;
    case 'ArrowDown':
      targetIndex = Math.min(allInputs.length - 1, currentIndex + cols);
      break;
  }
  
  if (targetIndex !== currentIndex) {
    allInputs[targetIndex].focus();
    allInputs[targetIndex].select();
  }
}

function onSetChange(el) {
  const matchId = el.dataset.match;
  const si = parseInt(el.dataset.set);
  const side = el.dataset.side;
  if (!sets[matchId]) {
    sets[matchId] = Array.from({length:5}, () => ({h:'', g:''}));
  }
  sets[matchId][si][side] = el.value;
  renderMatchList();
  manualAutoSave();
  if (fileAutoSaveActive) saveFileAutoSave();
}

function onSetBlur(el) {
  const val = el.value.trim();
  if (val === '') return;
  const num = parseInt(val);
  if (!isNaN(num) && num >= 0 && num <= 99) {
    el.value = num.toString();
  }
  const matchId = el.dataset.match;
  const si = parseInt(el.dataset.set);
  const side = el.dataset.side;
  if (!sets[matchId]) {
    sets[matchId] = Array.from({length:5}, () => ({h:'', g:''}));
  }
  sets[matchId][si][side] = el.value;
  renderMatchList();
  manualAutoSave();
  if (fileAutoSaveActive) saveFileAutoSave();
}

function calcSets(matchSets) {
  let hWins = 0, gWins = 0;
  (matchSets || []).forEach(s => {
    const h = parseInt(s.h)||0, g = parseInt(s.g)||0;
    if (h > 0 || g > 0) {
      if (h > g) hWins++;
      else if (g > h) gWins++;
    }
  });
  return {hWins, gWins};
}

function updateTotalScore() {
  let hTotal = 0, gTotal = 0;
  const config = getMatchConfig(currentMode);
  config.forEach(m => {
    const matchSets = sets[m.id] || Array.from({length:5}, () => ({h:'', g:''}));
    const {hWins, gWins} = calcSets(matchSets);
    if (hWins >= 3) hTotal++;
    else if (gWins >= 3) gTotal++;
  });
  document.getElementById('scoreHeim').textContent = hTotal;
  document.getElementById('scoreGast').textContent = gTotal;
  document.getElementById('finalH').textContent = hTotal;
  document.getElementById('finalG').textContent = gTotal;

  const heimName = document.getElementById('heimName').value || 'Heim';
  const gastName = document.getElementById('gastName').value || 'Gast';
  const label = document.getElementById('siegerLabel');
  if (hTotal > gTotal) {
    label.textContent = `🏆 ${heimName}`;
    label.className = 'winner-label home';
  } else if (gTotal > hTotal) {
    label.textContent = `🏆 ${gastName}`;
    label.className = 'winner-label guest';
  } else {
    label.textContent = '— Unentschieden';
    label.className = 'winner-label draw';
  }
}

// ====== SAVE ======
function saveSpielbericht() {
  const {h, g} = getPlayers();
  const heimName = document.getElementById('heimName').value || 'Heimteam';
  const gastName = document.getElementById('gastName').value || 'Gastteam';
  const datum = document.getElementById('spielDatum').value;
  const ort = document.getElementById('spielOrt').value;
  const mode = currentMode;

  let hTotal = 0, gTotal = 0;
  const config = getMatchConfig(mode);
  config.forEach(m => {
    const matchSets = sets[m.id] || Array.from({length:5}, () => ({h:'', g:''}));
    const {hWins, gWins} = calcSets(matchSets);
    if (hWins >= 3) hTotal++;
    else if (gWins >= 3) gTotal++;
  });

  const doubleCount = getDoubleCount(mode);
  const hd = [], gd = [];
  for (let d = 1; d <= doubleCount; d++) {
    hd.push([
      document.getElementById('hd'+d+'a')?.value || '1',
      document.getElementById('hd'+d+'b')?.value || '2'
    ]);
    gd.push([
      document.getElementById('gd'+d+'a')?.value || '1',
      document.getElementById('gd'+d+'b')?.value || '2'
    ]);
  }

  const entry = {
    id: Date.now(),
    datum, ort,
    heimName, gastName,
    mode,
    h, g,
    hd, gd,
    sets: JSON.parse(JSON.stringify(sets)),
    hTotal, gTotal
  };

  const history = getHistory();
  history.unshift(entry);
  localStorage.setItem('tt_spielberichte', JSON.stringify(history));
  localStorage.removeItem('tt_autosave');

  showToast('Spielbericht gespeichert!');
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem('tt_spielberichte') || '[]'); }
  catch { return []; }
}

// ====== IMPORT / EXPORT ======
function exportSpiel() {
  const data = getCurrentState();
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type: 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const name = data.heimName || 'spielstand';
  const datum = data.datum || new Date().toISOString().split('T')[0];
  a.download = `TT_Spielstand_${name}_${datum}.json`.replace(/\s+/g,'_');
  a.click();
  URL.revokeObjectURL(url);
  showToast('Spielstand exportiert!');
}

function importSpiel(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      restoreState(data);
      showToast('Spielstand importiert!');
    } catch (err) {
      showToast('Fehler: Ungültiges Dateiformat');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ====== VIEWS ======
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'verlauf') renderVerlauf();
}

function renderVerlauf() {
  const history = getHistory();
  const container = document.getElementById('verlaufList');
  if (history.length === 0) {
    container.innerHTML = `<div class="history-empty"><span class="big">📋</span>Noch keine Spielberichte gespeichert.<br>Trage ein Spiel ein und speichere es!</div>`;
    return;
  }
  container.innerHTML = history.map(e => {
    return `
      <div class="history-card" onclick="openDetail(${e.id})">
        <div class="history-top">
          <div class="history-teams">${e.heimName} vs ${e.gastName}</div>
          <div class="history-score">
            <span class="h">${e.hTotal}</span>
            <span class="sep">:</span>
            <span class="g">${e.gTotal}</span>
            <span class="history-badge">${e.mode || 4}er</span>
          </div>
        </div>
        <div class="history-date">${e.datum ? new Date(e.datum).toLocaleDateString('de-DE', {day:'2-digit',month:'long',year:'numeric'}) : ''}${e.ort ? ' · '+e.ort : ''}</div>
      </div>
    `;
  }).join('');
}

// ====== MODAL ======
let currentDetailId = null;

function openDetail(id) {
  const history = getHistory();
  const e = history.find(x => x.id === id);
  if (!e) return;
  currentDetailId = id;

  document.getElementById('modalTitle').textContent = `${e.heimName} ${e.hTotal}:${e.gTotal} ${e.gastName}`;

  const mode = e.mode || 4;
  const config = getMatchConfig(mode);

  const lines = config.map(m => {
    let hName, gName;
    if (m.type === 'double') {
      const dIdx = m.dIdx;
      if (e.hd && e.hd[dIdx]) {
        const a = parseInt(e.hd[dIdx][0]||1)-1;
        const b = parseInt(e.hd[dIdx][1]||2)-1;
        const c = parseInt(e.gd[dIdx][0]||1)-1;
        const d = parseInt(e.gd[dIdx][1]||2)-1;
        hName = `${e.h[a]}/${e.h[b]}`;
        gName = `${e.g[c]}/${e.g[d]}`;
      } else {
        hName = '—';
        gName = '—';
      }
    } else {
      hName = e.h[m.hIdx-1] || 'H'+m.hIdx;
      gName = e.g[m.gIdx-1] || 'G'+m.gIdx;
    }
    const matchSets = e.sets[m.id] || Array.from({length:5}, () => ({h:'', g:''}));
    const {hWins, gWins} = calcSets(matchSets);
    const winner = hWins >= 3 ? 'home' : gWins >= 3 ? 'guest' : '';
    return `
      <div class="result-match-row">
        <div class="result-players">
          <span class="h">${hName}</span> vs <span class="g">${gName}</span>
        </div>
        <div class="result-score">${hWins}:${gWins}</div>
        <div class="result-win ${winner || 'draw'}">${winner === 'home' ? '✓ H' : winner === 'guest' ? '✓ G' : '—'}</div>
      </div>
    `;
  });

  document.getElementById('modalContent').innerHTML = `
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">
      ${e.datum ? new Date(e.datum).toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'}) : ''}
      ${e.ort ? ' · '+e.ort : ''}
      <span class="badge" style="margin-left:8px">${mode}er</span>
    </div>
    ${lines.join('')}
  `;

  document.getElementById('detailModal').classList.add('open');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('open');
  currentDetailId = null;
}

function deleteSpiel() {
  if (!currentDetailId) return;
  let history = getHistory();
  history = history.filter(x => x.id !== currentDetailId);
  localStorage.setItem('tt_spielberichte', JSON.stringify(history));
  closeModal();
  renderVerlauf();
  showToast('Spielbericht gelöscht');
}

function downloadSpiel() {
  if (!currentDetailId) return;
  const history = getHistory();
  const e = history.find(x => x.id === currentDetailId);
  if (!e) return;

  const mode = e.mode || 4;
  const config = getMatchConfig(mode);

  let lines = [];
  lines.push(`SPIELBERICHT – ${e.heimName} vs ${e.gastName} (${mode}er)`);
  lines.push(`Datum: ${e.datum ? new Date(e.datum).toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'}) : '—'}${e.ort ? '  |  Ort: '+e.ort : ''}`);
  lines.push(`Ergebnis: ${e.heimName} ${e.hTotal} : ${e.gTotal} ${e.gastName}`);
  lines.push('');
  lines.push('─'.repeat(56));
  lines.push('');

  config.forEach(m => {
    let hName, gName;
    if (m.type === 'double') {
      const dIdx = m.dIdx;
      if (e.hd && e.hd[dIdx]) {
        const a = parseInt(e.hd[dIdx][0]||1)-1;
        const b = parseInt(e.hd[dIdx][1]||2)-1;
        const c = parseInt(e.gd[dIdx][0]||1)-1;
        const d = parseInt(e.gd[dIdx][1]||2)-1;
        hName = `${e.h[a]}/${e.h[b]}`;
        gName = `${e.g[c]}/${e.g[d]}`;
      } else {
        hName = '—';
        gName = '—';
      }
    } else {
      hName = e.h[m.hIdx-1] || 'H'+m.hIdx;
      gName = e.g[m.gIdx-1] || 'G'+m.gIdx;
    }
    const matchSets = e.sets[m.id] || Array.from({length:5}, () => ({h:'', g:''}));
    const {hWins, gWins} = calcSets(matchSets);
    const sätze = matchSets.filter(s => (parseInt(s.h)||0)+(parseInt(s.g)||0)>0)
      .map(s => `${s.h}:${s.g}`).join('  ');
    const winner = hWins >= 3 ? `→ ${hName}` : gWins >= 3 ? `→ ${gName}` : '';
    lines.push(`${m.label}`);
    lines.push(`  ${hName} vs ${gName}`);
    lines.push(`  Sätze: ${hWins}:${gWins}   (${sätze})   ${winner}`);
    lines.push('');
  });

  lines.push('─'.repeat(56));
  lines.push(`Endstand: ${e.heimName} ${e.hTotal} : ${e.gTotal} ${e.gastName}`);

  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const datumStr = e.datum ? e.datum : 'datum';
  a.download = `Spielbericht_${e.heimName}_vs_${e.gastName}_${datumStr}.txt`.replace(/\s+/g,'_');
  a.click();
  URL.revokeObjectURL(url);
  showToast('Spielbericht heruntergeladen!');
}

// ====== RESET ======
function resetForm() {
  if (!confirm('Neues Spiel beginnen? Das aktuelle Formular wird geleert.')) return;
  const config = getMatchConfig(currentMode);
  config.forEach(m => {
    sets[m.id] = Array.from({length:5}, () => ({h:'', g:''}));
  });
  document.getElementById('heimName').value = 'Heimteam';
  document.getElementById('gastName').value = 'Gastteam';
  document.getElementById('spielOrt').value = '';
  document.getElementById('spielDatum').value = new Date().toISOString().split('T')[0];
  const count = getPlayerCount(currentMode);
  for (let i = 1; i <= count; i++) {
    const hEl = document.getElementById('h'+i);
    const gEl = document.getElementById('g'+i);
    if (hEl) hEl.value = '';
    if (gEl) gEl.value = '';
  }
  const doubleCount = getDoubleCount(currentMode);
  for (let d = 1; d <= doubleCount; d++) {
    const hd1 = document.getElementById('hd'+d+'a');
    const hd2 = document.getElementById('hd'+d+'b');
    const gd1 = document.getElementById('gd'+d+'a');
    const gd2 = document.getElementById('gd'+d+'b');
    if (hd1) hd1.value = (d-1)*2 + 1;
    if (hd2) hd2.value = (d-1)*2 + 2;
    if (gd1) gd1.value = (d-1)*2 + 1;
    if (gd2) gd2.value = (d-1)*2 + 2;
  }
  renderMatchList();
  updateDoubleSelects();
  localStorage.removeItem('tt_autosave');
  showToast('Neues Spiel gestartet');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
